<h2>اليوم 1: قياس المراجعة البشرية وضبط عتبات الوكيل</h2>
<ol>
<li><p>في مكتب افتراضي لرخص الصيد، وافق المراجعون على 97% من توصيات النظام في شهر. يقول المدير إن المراجعة تعمل جيدًا.</p><ul><li><b>أ.</b> النظام دقيق، فالمراجعة تعمل كما يجب</li><li><b>ب.</b> لا نعرف حتى نزرع أخطاء ونعدّ ما يُلتقط منها</li><li><b>ج.</b> نزيد وقت المراجعة، فتعمل المراجعة عندئذ</li><li><b>د.</b> نقارن موافقات المراجعين ببعضهم، فإن اتفقوا عملت</li></ul></li>
<li><p>في جهة أخرى، التقط مراجع 4 من 10 أخطاء مزروعة، ثم 7 من 10 في قائمة مكافئة بعد أن صارت المستندات مفتوحة. فترتا الثقة متداخلتان.</p><ul><li><b>أ.</b> نعم، فقد ارتفع الاكتشاف من 40% إلى 70%</li><li><b>ب.</b> لا، فالأداة لا أثر لها في الاكتشاف</li><li><b>ج.</b> نعم، فالقائمتان متكافئتان والفرق ثلاثة أخطاء</li><li><b>د.</b> لا نعرف بعد، فتلزم جلسات أكثر أو قائمة أطول</li></ul></li>
<li><p>وكيل في شركة مياه افتراضية يرسل بيانات استهلاك العميل كاملة إلى شركة صيانة متعاقدة حين يُفتح بلاغ تسرب. حدث خطأ واحد في شهرين.</p><ul><li><b>أ.</b> يتوقف للاعتماد، فالبيانات إذا أُرسلت لا تعود</li><li><b>ب.</b> تلقائي، فخطأ واحد في شهرين نسبة صغيرة</li><li><b>ج.</b> إخطار، فيراه المشرف في اليوم التالي ويصححه</li><li><b>د.</b> ممنوع على الوكيل، ويرسله الموظف بنفسه دائمًا</li></ul></li>
<li><p>في مكتب افتراضي لتجديد رخص القيادة، زُرع 15 خطأً في توصيات أسبوع، والتقط المراجع 9 منها. فترة الثقة 95% لمعدل الاكتشاف من 35.7% إلى 80.2%، والهدف 80%. ما الحكم بقاعدة المقرر؟</p><ul><li><b>أ.</b> ليست ضابطًا، فالمعدل 60% تحت الهدف</li><li><b>ب.</b> العينة لا تكفي، فالفترة تعبر الهدف</li><li><b>ج.</b> ضابط فعلي، فالحد الأعلى فوق الهدف</li><li><b>د.</b> ليست ضابطًا، فالحد الأدنى تحت الهدف</li></ul></li>
<li><p>أي مقياس يقول ما يلتقطه المراجع من أخطاء النظام؟</p><ul><li><b>أ.</b> نسبة التوصيات التي اعتمدها المراجع كما هي</li><li><b>ب.</b> متوسط الثواني التي يقضيها المراجع في الحالة</li><li><b>ج.</b> نسبة التوصيات التي غيّرها المراجع من الكل</li><li><b>د.</b> نسبة ما غيّره أو صعّده من الأخطاء المزروعة</li></ul></li>
<li><p>إذا انخفض معدل تجاوز مراجع إلى ما يقارب الصفر، فهذا وحده دليل كافٍ على أنه صار يعتمد التوصيات دون مراجعة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>قبل أن يجرب فريق في جهة افتراضية أداة جديدة في خطوة المراجعة، ما الذي يكتبه أولًا؟</p><ul><li><b>أ.</b> الفرق في الاكتشاف الذي يكفي ليقول إن الأداة أفضل</li><li><b>ب.</b> أسماء المراجعين الذين ستُعرض نتائجهم على الفريق</li><li><b>ج.</b> الأداة الثانية التي سيجربها إن لم تنجح الأولى</li><li><b>د.</b> عدد الحالات التي يراجعها المراجع في الساعة الآن</li></ul></li>
<li><p>وكيل في هيئة نقل افتراضية أرسل رسالة جماعية خاطئة إلى عشرين ألف مشترك. ما قابلية التراجع عنها؟</p><ul><li><b>أ.</b> يُتراجع عنها، فرسالة تصحيح ثانية تكفي</li><li><b>ب.</b> بكلفة، فالتصحيح يكلف رسالة ثانية</li><li><b>ج.</b> لا يُتراجع عنها، فقد وصلت وقُرئت</li><li><b>د.</b> لا ينطبق، فالرسالة ليست قرارًا</li></ul></li>
<li><p>أوقف فريق كل إجراء أثره متوسط أو أعلى للاعتماد، فصار ما يتوقف ضعف طاقة المعتمدين. ما أرجح ما يحدث؟</p><ul><li><b>أ.</b> يصير الاعتماد شكليًا، فيُعتمد بالجملة دون قراءة</li><li><b>ب.</b> يقل الضرر، فكل إجراء مهم يراه إنسان قبل أن يقع</li><li><b>ج.</b> تتحسن الطاقة، فيتعلم المعتمدون السرعة مع الوقت</li><li><b>د.</b> لا يتغير شيء، فالعتبات لا تؤثر في عمل المعتمدين</li></ul></li>
<li><p>بقاعدة المقرر، يجوز أن يجعل استثناء في ملف العتبات نوعًا من الإجراءات أخف من وضعه في المصفوفة إذا كان المبلغ صغيرًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في جهة افتراضية لها معتمدان، توقف رد للرسوم على ملف مسند إلى المعتمد الأول. من يعتمده؟</p><ul><li><b>أ.</b> المعتمد الأول، فهو أعرف بالملف</li><li><b>ب.</b> مالك النظام، فهو مسؤول عن الوكيل</li><li><b>ج.</b> أيهما، فالرد مبلغ صغير في الغالب</li><li><b>د.</b> المعتمد الآخر، فلا يعتمد أحد ملفه</li></ul></li>
</ol>

<section>
<h2>اليوم 2: قابلية الاعتراض ولجنة مراجعة الأخلاقيات</h2>
<ol>
<li><p>في هيئة نقل افتراضية، يُرفض طلب بطاقة الخصم بتوصية نظام. التظلم على الموقع خلال 30 يومًا، ويعيد القرار الموظف الذي اعتمد الرفض، ويُرد المبلغ إن قُبل التظلم.</p><ul><li><b>أ.</b> مهلة أقصر للتقديم حتى يُبت في التظلمات بسرعة</li><li><b>ب.</b> إعادة تشغيل النظام على الطلب قبل أن يراه موظف</li><li><b>ج.</b> جبر الضرر برد المبلغ بعد قبول التظلم مباشرة</li><li><b>د.</b> قناة غير رقمية، وموظف آخر يعيد القرار</li></ul></li>
<li><p>وافقت لجنة في هيئة النقل الافتراضية بشروط على مساعد يقترح ردودًا على شكاوى الركاب. كُتب في السجل أربعة شروط مقترحة.</p><ul><li><b>أ.</b> يراجع موظفان عينة من 40 ردًا كل شهر، ويرفعان تقريرًا إلى اللجنة</li><li><b>ب.</b> عينة شهرية من 40 ردًا، ويوقفه رئيس فريق الشكاوى إن زاد الخطأ على 5% شهرين، ومراجعة بعد ستة أشهر</li><li><b>ج.</b> الحرص الدائم على أن تكون ردود المساعد منصفة وواضحة لكل الركاب</li><li><b>د.</b> يُوقف المساعد فورًا إن اشتكى أي راكب من رد، ومراجعة بعد ستة أشهر</li></ul></li>
<li><p>رفض نظام في بلدية افتراضية طلبًا، واعتمد موظف الرفض، ثم تظلم صاحب الطلب. من يعيد القرار؟</p><ul><li><b>أ.</b> الموظف الذي اعتمد الرفض أول مرة</li><li><b>ب.</b> النظام نفسه بعد إعادة تشغيله على الطلب</li><li><b>ج.</b> مالك النظام، فهو يعرف سبب التوصية</li><li><b>د.</b> موظف آخر يقرأ المستندات الأصلية من جديد</li></ul></li>
<li><p>أي جملة يجب أن تكون في إشعار قرار شارك فيه نظام ذكاء اصطناعي؟</p><ul><li><b>أ.</b> أن النظام دقيق في أغلب قراراته السابقة</li><li><b>ب.</b> أن نظامًا أوصى بالقرار وراجعه موظف</li><li><b>ج.</b> أن القرار نهائي ما لم تثبت المستندات غيره</li><li><b>د.</b> أن الاستفسار متاح عبر الموقع الإلكتروني</li></ul></li>
<li><p>أكثر من ثلث المتقدمين لخدمة افتراضية يأتون إلى مركز الخدمة، لكن 5% فقط من التظلمات تصل منه. ماذا تستنتج أولًا؟</p><ul><li><b>أ.</b> أن قرارات المركز أدق من قرارات الموقع</li><li><b>ب.</b> أن من يأتون إلى المركز أكثر رضا بالقرارات</li><li><b>ج.</b> أن مسار التظلم قد لا يعمل لمن في المركز</li><li><b>د.</b> أن التظلمات قليلة فلا تحتاج إلى قياس</li></ul></li>
<li><p>جبر الضرر في مسار التظلم قد يشمل أكثر من إلغاء القرار، كرد الرسوم وإزالة أثر القرار من السجل.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>قدّر مالك نظام مخاطر نظامه «منخفضة»، فطلب إعفاءه من لجنة مراجعة الأخلاقيات. أي محفز يمنع الإعفاء إن ثبت؟</p><ul><li><b>أ.</b> أن يُخرج الاستخدام إنسانًا من قرار يمس شخصًا</li><li><b>ب.</b> أن يكون التقييم موقعًا من مالك النظام نفسه</li><li><b>ج.</b> أن يكون النظام مشترًى من مورد خارج الجهة</li><li><b>د.</b> أن تتجاوز كلفة النظام حدًا تحدده الإدارة المالية</li></ul></li>
<li><p>في مصفوفة الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي، خطر احتماليته «مرجح (3)» وأثره «مرتفع (3)». ما مستواه؟</p><ul><li><b>أ.</b> خطر متوسط، فالدرجة 6</li><li><b>ب.</b> خطر كارثي، فالأثر مرتفع</li><li><b>ج.</b> خطر مرتفع، فالدرجة 9</li><li><b>د.</b> خطر منخفض، فالاحتمالية دون 4</li></ul></li>
<li><p>لماذا يعرض صاحب الملف ملفه على اللجنة ويجيب، ولا يصوت؟</p><ul><li><b>أ.</b> حتى لا يطول وقت الجلسة بالمداولة</li><li><b>ب.</b> حتى لا يحكم على عمله بنفسه</li><li><b>ج.</b> حتى يبقى عدد المصوتين فرديًا</li><li><b>د.</b> حتى لا يطلع على آراء الأعضاء</li></ul></li>
<li><p>فئات المخاطر الأربع في مبادئ أخلاقيات الذكاء الاصطناعي ليست هي مستويات المصفوفة في الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>وافقت لجنة على نظام «بشرط المراقبة المستمرة». ما العيب في الشرط؟</p><ul><li><b>أ.</b> أنه يشدد على مالك النظام أكثر مما يلزم</li><li><b>ب.</b> أنه بلا مقياس ولا حد ولا مالك ولا موعد</li><li><b>ج.</b> أنه يجعل الموافقة مؤقتة لا نهائية</li><li><b>د.</b> أنه يحتاج إلى عضو مستقل يراقب النظام بنفسه</li></ul></li>
<li><p>صوتت أغلبية لجنة بالموافقة، وخالف عضو واحد. ماذا يبقى في السجل؟</p><ul><li><b>أ.</b> رأيه المخالف باسمه وسببه بالمعايير</li><li><b>ب.</b> عدد الأصوات وحده دون أي أسماء</li><li><b>ج.</b> القرار وحده، فالرأي لم يُعتمد</li><li><b>د.</b> رأيه إن طلب هو ذلك كتابة بعد الجلسة</li></ul></li>
<li><p>ملف في جهة افتراضية يقترح ترتيب مستفيدين من دعم بدرجة تُحسب من نشاطهم في وسائل التواصل. على أي نص يُستند أولًا في رفضه؟</p><ul><li><b>أ.</b> المنافع الاجتماعية والبيئية، فالمنفعة غير مقيسة</li><li><b>ب.</b> الموثوقية، فالنموذج لم يُختبر على بيانات جديدة</li><li><b>ج.</b> ألا تُستخدم الأنظمة للتقييم الاجتماعي أو المراقبة</li><li><b>د.</b> الشفافية، فالمستفيد لا يعرف الدرجة التي أخذها</li></ul></li>
<li><p>إذا وافقت اللجنة على استخدام بشروط مكتوبة، فلا حاجة إلى موعد لمراجعة القرار لاحقًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
